[package]
name = "dngeat"
version = "0.1.0"
edition = "2021"
description = "Convert camera RAW files (ARW, ...) to DNG in place, then eat the originals to save space"
license = "MIT"

[dependencies]
rawler = "0.7"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
walkdir = "2"
anyhow = "1"
sha2 = "0.10"
nix = { version = "0.29", features = ["fs"] }
filetime = "0.2"
ctrlc = "3"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
